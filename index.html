<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muntasir Netflix</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">Muntasir<span>Netlix</span></div>

    <nav>
      <a href="#home">Home</a>
      <a href="#movies">Movies</a>
      <a href="#series">TV Series</a>
      <a href="#mylist">My List</a>
    </nav>

    <button class="search-btn" onclick="toggleSearch()">🔍</button>
  </header>

  <div id="searchBox" class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="searchMovies()">
  </div>

  <main>

    <section id="home" class="hero">
      <div class="hero-content">
        <p class="small-title">Muntasir</p>
        <h1>Welcome to<br>Muntasir Netflix</h1>

        <p class="description">
          Watch your favorite movies and series in one place.
        </p>

        <div class="buttons">
          <button class="play-btn" onclick="playDemo()">▶ Play</button>
          <button class="info-btn" onclick="showInfo()">ⓘ More Info</button>
        </div>
      </div>
    </section>

    <section id="movies" class="section">
      <h2>Watch Now</h2>

      <div class="movie-row">

        <div class="movie-card" data-title="FREE NETFLIX"
     onclick="window.open('https://net77.cc/home?utm_source=home_page', '_blank')">

  <div class="poster poster1">
    <img src="https://img.magnific.com/free-photo/abstract-red-background-vertical-lines-strips_1258-108652.jpg?semt=ais_hybrid&w=740&q=80">
  </div>

  <p>Movie One</p>
</div>



  <footer>
    <div class="logo">Muntasir<span>netlix</span></div>
    <p>© 2026 Muntasir Netlix. All rights reserved.</p>
  </footer>

  <div id="modal" class="modal">
    <div class="modal-content">
      <button class="close" onclick="closeModal()">×</button>
      <h2 id="modalTitle">Movie</h2>
      <p id="modalText"></p>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
